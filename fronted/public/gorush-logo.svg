
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Emerald / Lime Gradients -->
    <linearGradient id="pinGrad" x1="120" y1="60" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="280" y1="200" x2="380" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <linearGradient id="trailGrad1" x1="70" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="trailGrad2" x1="40" y1="0" x2="190" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="trailGrad3" x1="90" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Soft Glow Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15803d" flood-opacity="0.35" />
    </filter>
    <filter id="leafGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Speed Motion Trails -->
  <g transform="translate(0, 30)">
    <rect x="70" y="145" width="130" height="24" rx="12" fill="url(#trailGrad1)" />
    <rect x="40" y="195" width="145" height="24" rx="12" fill="url(#trailGrad2)" />
    <rect x="90" y="245" width="115" height="24" rx="12" fill="url(#trailGrad3)" />
  </g>

  <!-- Main Speed Pin Body -->
  <g filter="url(#glow)">
    <!-- Aerodynamic Pin -->
    <path d="M 295 80 C 215 80 150 145 150 225 C 150 285 200 330 270 415 C 285 433 305 433 320 415 C 390 330 440 285 440 225 C 440 145 375 80 295 80 Z"
          fill="url(#pinGrad)" />
    
    <!-- Pin Core Cutout (White Inner Ring for Depth) -->
    <circle cx="295" cy="210" r="54" fill="#ffffff" />
    <circle cx="295" cy="210" r="42" fill="#f4f9ef" opacity="0.9" />
  </g>

  <!-- Organic Energy Leaf overlapping bottom right of pin -->
  <g filter="url(#leafGlow)">
    <path d="M 290 285 C 290 285 365 240 395 210 C 405 260 380 320 325 345 C 290 360 285 315 290 285 Z"
          fill="url(#leafGrad)" />
    <!-- Leaf Center Spine -->
    <path d="M 290 285 Q 340 275 390 215" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
