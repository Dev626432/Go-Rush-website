<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#152016" />
    <link rel="icon" type="image/png" href="/gorush-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>GoRush | Drive. Earn. Grow.</title>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:#0c1811;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif;">
        <div style="width:70px;height:70px;border-radius:20px;overflow:hidden;box-shadow:0 0 30px rgba(123,196,74,0.4);display:flex;align-items:center;justify-content:center;background:transparent;">
          <img src="/gorush-logo.png" alt="GoRush" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <div style="margin-top:20px;width:34px;height:34px;border:3px solid rgba(123,196,74,0.2);border-top-color:#7bc44a;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
